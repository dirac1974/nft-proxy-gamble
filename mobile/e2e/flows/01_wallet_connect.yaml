appId: com.nftproxygamble.app
name: "First run + Wallet Connect + SIWE Authentication"
tags:
  - auth
  - critical

---
- launchApp:
    clearState: true

# First-run age gate (local declaration) appears before anything else
- assertVisible:
    text: "Are you 18 or older?"
- tapOn:
    id: "age-yes"

# Onboarding cards — skip straight to the lobby
- assertVisible:
    text: "Buy coins, play games."
- tapOn:
    id: "onboarding-skip"

# Logged-out lobby is browsable
- assertVisible:
    text: "AURUM"
- assertVisible:
    id: "tile-video-poker"
- assertVisible:
    id: "tile-blackjack"
- assertVisible:
    id: "tile-roulette"

# Tapping a game while logged out opens the Connect sheet
- tapOn:
    id: "tile-video-poker"
- assertVisible:
    text: "Connect your wallet"
- tapOn:
    id: "connect-wallet-button"

# WalletConnect modal opens
- assertVisible:
    text: "Connect via QR"
- tapOn:
    text: "Connect via QR"

# In sandbox mode WalletConnect deep-link completes automatically.
- waitForAnimationToEnd:
    timeout: 8000

# Sign-In With Ethereum confirmation prompt (wallet side)
- assertVisible:
    text: "Sign to authenticate"
    enabled: true
- tapOn:
    text: "Sign to authenticate"

- waitForAnimationToEnd:
    timeout: 5000

# Server age confirmation is auto-submitted from the first-run declaration,
# so the server age gate should not block the lobby.
- assertNotVisible:
    id: "age-gate-modal"

# Authenticated lobby shows the balance pill with the buy button
- assertVisible:
    id: "balance-pill"
- assertVisible:
    id: "buy-coins-button"
