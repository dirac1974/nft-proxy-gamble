appId: com.nftproxygamble.app
name: "Video Poker — play 5 hands then cash out from Wallet"
tags:
  - game
  - cashout
  - critical

---
- launchApp

# Open Video Poker from the lobby
- tapOn:
    id: "tile-video-poker"

- waitForAnimationToEnd:
    timeout: 3000

# Needs coins — assume 100+ from IAP test or prior state
- assertVisible:
    id: "deal-button"

# Play 5 hands: one DEAL tap, hold a card, DRAW
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "deal-button"
      - waitForAnimationToEnd:
          timeout: 4000
      - tapOn:
          id: "card-0"
      - tapOn:
          id: "draw-button"
      - waitForAnimationToEnd:
          timeout: 4000

# Relaunch lands back in the lobby
- launchApp

# Cash out now lives on the Wallet tab
- tapOn:
    text: "Wallet"
- assertVisible:
    id: "cashout-button"
- tapOn:
    id: "cashout-button"

- assertVisible:
    id: "cashout-sheet"
- tapOn:
    id: "cashout-quick-min"
- assertVisible:
    text: "You'll get \$1.00 USDC as a voucher"
- tapOn:
    id: "cashout-confirm"

- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    text: "Cash-out started"
- tapOn:
    id: "cashout-view-wallet"

# New voucher appears while it is being created
- assertVisible:
    text: "Creating…"
