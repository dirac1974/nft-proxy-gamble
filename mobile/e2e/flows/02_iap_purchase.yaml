appId: com.nftproxygamble.app
name: "IAP Purchase — coins credited from server"
tags:
  - iap
  - critical

---
- launchApp

# Must be authenticated (depends on 01_wallet_connect completing first in a suite run)
- assertVisible:
    id: "balance-pill"

- tapOn:
    id: "buy-coins-button"

# IAP sheet opens
- assertVisible:
    id: "iap-sheet"
- assertVisible:
    id: "coin-pack-100"
- assertVisible:
    text: "\$0.99"

# Select 100-coin pack
- tapOn:
    id: "coin-pack-100"

# Sandbox IAP sheet appears (iOS StoreKit / Android test environment)
- assertVisible:
    text: "Confirm your In-App Purchase"
- tapOn:
    text: "Buy"

- waitForAnimationToEnd:
    timeout: 10000

# Sheet auto-closes after server verification and a toast confirms
- assertNotVisible:
    id: "iap-sheet"
- assertVisible:
    id: "global-toast"

# Balance should have increased (server-authoritative)
- assertVisible:
    id: "balance-pill"

# Adversarial: sheet dismissed without purchase — balance must NOT change
- tapOn:
    id: "buy-coins-button"
- tapOn:
    id: "coin-pack-550"
- assertVisible:
    text: "Confirm your In-App Purchase"

# Cancel instead of buying
- tapOn:
    text: "Cancel"

- waitForAnimationToEnd:
    timeout: 3000

# Balance unchanged
- assertVisible:
    id: "balance-pill"
